site_name: "Thomas Camminady"
site_url: https://camminady.dev
site_description: "Thomas Camminady, senior data scientist at Wahoo Fitness."

# Minimal custom theme, see theme/. It renders no navigation: every page in
# docs/ is still built at its usual URL, the homepage links (below) are the
# only way in.
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html

# Private, git-ignored; never build it even from a local checkout.
exclude_docs: |
  getting_married.md

extra:
  links:
    - name: GitHub
      icon: github
      url: https://github.com/thomascamminady
    - name: LinkedIn
      icon: linkedin
      url: https://www.linkedin.com/in/camminady/
    - name: Email
      icon: envelope
      url: mailto:scarab73_tutors@icloud.com
    - name: CV
      url: cv/
    - name: Projects
      url: projects/

plugins:
  - glightbox

markdown_extensions:
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
